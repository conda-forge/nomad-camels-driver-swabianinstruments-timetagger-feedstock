schema_version: 1

context:
  name: nomad-camels-driver-swabianinstruments-timetagger
  version: "0.1.2"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/nomad_camels_driver_swabianinstruments_timetagger-${{ version }}.tar.gz
  sha256: d481a9892b5dc85c015859684e2ded89e3bd6c4660c82db13f3a1d586a3380d4

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - nomad-camels

tests:
  - python:
      imports:
        - nomad_camels_driver_swabianinstruments_timetagger
      pip_check: false
      python_version: ${{ python_min }}
about:
  summary: Instrument driver for a SwabianInstruments TimeTagger for NOMAD-CAMELS
  license: LGPL-2.1-or-later
  license_file: LICENSE.txt
  homepage: https://github.com/FAU-LAP/CAMELS_drivers

extra:
  recipe-maintainers:
    - jan-janssen
